import "dto/query/AftersaleQuery.proto";
import "dto/response/AftersaleResponse.proto";

service AfterSaleQueryGrpcService {
  rpc queryAfterSale (AfterSaleGrpcQuery) returns (AfterSaleGrpcResponse){}
}


