syntax = "proto3";

package com.taotao.cloud.order.api.grpc;

option java_multiple_files = true;
option java_package = "com.taotao.cloud.order.api.grpc";
option java_outer_classname = "DtoProto";
//option objc_class_prefix = "HLW";


message AfterSaleGrpcQuery {
  string id = 1;
}

message AfterSaleGrpcResponse {
  bool reply = 1;
}

message OrderGrpcResponse {
    bool reply = 1;
}
